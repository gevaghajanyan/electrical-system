name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

# One in-flight deployment at a time; cancel the previous run on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # For a project repo (owner/repo) the site is served at /<repo-name>/.
      # Detect it and expose to Next.js as basePath.
      # For a user/org repo (owner.github.io) leave BASE_PATH empty.
      - name: Compute base path
        id: base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (static export)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.base }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      # GitHub Pages runs Jekyll by default and strips folders starting with an
      # underscore — Next stores its assets in _next/ so we must opt out.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
